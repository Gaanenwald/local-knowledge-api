services:
  ollama:
    image: ollama/ollama:latest
    container_name: local-knowledge-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    gpus: all
    environment:
      OLLAMA_KEEP_ALIVE: 5m

  db:
    image: pgvector/pgvector:pg16
    container_name: local-knowledge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d knowledge" ]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  ollama_data:
    name: ollama_data
  postgres_data:
    name: postgres_data
